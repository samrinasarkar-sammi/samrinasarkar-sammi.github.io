    <style>
    /* Remove the four-number statistics strip. */
    #root section[class~="border-y"][class~="py-8"] {
      display: none !important;
    }
    #root h1 {
      font-size: clamp(34px, 7.5vw, 96px) !important;
      line-height: 0.95 !important;
      white-space: pre-line;
      letter-spacing: -0.025em;
      padding-bottom: 12px;
    }
  </style>

  <body>
    <div id="root"></div>
    <script>
    (() => {
      const root = document.getElementById('root');
      function updateHeading() {
        const heading = root.querySelector('h1');
        if (!heading) return false;
        heading.textContent = 'SAMRINA\nSARKAR SAMMI';
        return true;
      }

      function splitSections() {
        const heading = Array.from(root.querySelectorAll('h2'))
          .find(el => el.textContent.trim() === 'Education & Experience');
        if (!heading) return false;
        const old = heading.closest('section');
        const education = [{"when": "Sept 2026 – 2027", "title": "MSc Data Science & Network Intelligence", "place": "Télécom SudParis, France (M2)", "desc": "Deep Learning, Predictive Analytics, Large-Scale Data Processing and Network Automation."}, {"when": "Sept 2025 – July 2026", "title": "Chinese Language Programme", "place": "Suihua University, China", "desc": "A year of language study abroad, building on Mandarin (HSK 2)."}, {"when": "Jan 2019 – Mar 2023", "title": "BSc Computer Science & Engineering", "place": "Daffodil International University, Bangladesh", "desc": "CGPA 3.91/4.00. Thesis: COVID-19 feedback text mining using ML, deep learning and hybrid approaches."}];
        const experience = [{"when": "Mar – June 2026", "title": "Freelance Web Developer & SEO Analyst", "place": "Al Fajar Furniture", "desc": "Built a WordPress website and used analytics to guide SEO, reaching monthly growth of 222% in engaged sessions and 142% in users."}, {"when": "Oct 2022 – Jan 2025", "title": "Research Assistant", "place": "Daffodil International University", "desc": "NLP, ML/DL and computer vision research through data analysis, modelling and evaluation; co-authored two publications with the NLP & ML Research Lab."}, {"when": "2018 – 2025", "title": "Private English Tutor", "place": "Freelance, Dhaka", "desc": "English lessons and academic support for secondary and university students."}];
        function makeSection(title, records, id) {
          const section = document.createElement('section');
          section.id = id;
          section.className = 'bg-(--color-canvas) py-14';
          const container = document.createElement('div');
          container.className = 'mx-auto max-w-6xl px-6';
          const h = document.createElement('h2');
          h.className = 'font-display text-4xl italic sm:text-5xl';
          h.textContent = title;
          container.append(h);
          const grid = document.createElement('div');
          grid.className = 'mt-9 grid gap-8 sm:grid-cols-2 lg:grid-cols-3';
          records.forEach(record => {
            const card = document.createElement('div');
            card.className = 'border-t border-(--color-ink)/15 pt-5';
            for (const [tag, value, css] of [
              ['div', record.when, 'font-display text-sm text-(--color-accent)'],
              ['h3', record.title, 'mt-3.5 text-[15px] uppercase tracking-wide'],
              ['div', record.place, 'mt-1 text-[12px] text-(--color-accent)/80'],
              ['p', record.desc, 'mt-2.5 text-[12.5px] leading-[1.7] text-(--color-ink-dim)']
            ]) {
              const el = document.createElement(tag);
              el.className = css;
              el.textContent = value;
              if (value === 'Al Fajar Furniture') {
                const link = document.createElement('a');
                link.href = 'https://alfajarfurniture.com/';
                link.textContent = value;
                el.replaceChildren(link);
              }
              card.append(el);
            }
            grid.append(card);
          });
          container.append(grid);
          section.append(container);
          return section;
        }
        const educationSection = makeSection('Education', education, 'education');
        const experienceSection = makeSection('Experience', experience, 'experience');
        const awardsSection = makeSection('Leadership and Awards', [
          {when:'2022',title:'Executive Member',place:'DIU NLP & ML Research Lab',desc:'Led the research/publications wing; organised workshops and webinars.'},
          {when:'Multiple semesters',title:'Brilliant Academic Result Scholarship',place:'Daffodil International University',desc:'Awarded across multiple semesters, with up to 50% tuition waiver.'},
          {when:'2021',title:'Best Volunteer Award',place:'DIU Computer and Programming Club',desc:''}
        ], 'leadership-awards');
        old.replaceWith(educationSection, experienceSection, awardsSection);
        // Remove the old duplicate awards block beside the publications.
        const label = Array.from(root.querySelectorAll('div'))
          .find(el => el.children.length === 0 && el.textContent.trim() === 'Leadership & Awards');
        if (label) label.parentElement.remove();
        return true;
      }
      const observer = new MutationObserver(() => {
        if (updateHeading() && splitSections()) observer.disconnect();
      });
      observer.observe(root, { childList: true, subtree: true });
      if (updateHeading() && splitSections()) observer.disconnect();
    })();
  </script>
  </body>
